[workspace]
resolver = "3"
members = ["crates/koma", "crates/koma-fixtures", "crates/koma-webp", "xtask"]
# Fuzz targets build on nightly, with their own lock file: see docs/development.md.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

# One small, fast, static binary. Size matters: the container image has a budget.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Dependencies optimised even in debug builds: decoding, resizing and
# encoding page variants unoptimised makes the tests minutes instead of seconds.
[profile.dev.package."*"]
opt-level = 2
