[workspace]
resolver = "3"
members = ["crates/koma", "crates/koma-fixtures", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

# One small, fast, static binary. Size matters: the container image has a budget.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
