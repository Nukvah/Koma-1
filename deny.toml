# cargo-deny: licences, security advisories, banned crates and sources.
# Run locally with `cargo deny check`.

[graph]
all-features = false
# Only what Koma-1 is built for: leaves out dependencies that exist only for
# other targets (rav1e's wasm and `cfg(fuzzing)` ones, for example).
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
]

[advisories]
# Every advisory fails, unmaintained crates included. Ignore one only with a reason.
ignore = []

[licenses]
# Permissive licences only; add one here when a new dependency needs it.
allow = [
    "Apache-2.0",
    # rav1e (AVIF encoding).
    "BSD-2-Clause",
    "BSD-3-Clause",
    # jpeg-encoder (test pages). Permissive; binaries must say they are
    # "based in part on the work of the Independent JPEG Group": README.md
    # does, for jpegli, built with libjpeg's headers.
    "IJG",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the workspace's own unpublished crates are fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
