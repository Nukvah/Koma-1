[package]
name = "koma"
version = "0.0.0"
description = "Koma-1: a self-hosted manga server in one binary (serve, worker, scrub)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
blake3 = "1.8"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.43", features = ["bundled", "collation"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "net", "signal", "macros"] }

[dev-dependencies]
blake3 = "1.8"
koma-fixtures = { path = "../koma-fixtures" }
tokio = { version = "1.54", features = ["sync"] }

[lints]
workspace = true
