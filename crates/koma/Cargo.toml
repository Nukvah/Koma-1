[package]
name = "koma"
version = "0.0.0"
description = "Koma-1: a self-hosted manga server in one binary (serve, worker, scrub)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "net", "signal", "macros"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["sync"] }

[lints]
workspace = true
