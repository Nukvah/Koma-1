[package]
name = "koma"
version = "0.0.0"
description = "Koma-1: a self-hosted manga server in one binary (serve, worker, scrub)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Accounts: passwords (argon2id, pure Rust), random tokens from the OS, and
# passkey signatures (ES256 and EdDSA, RustCrypto, pure Rust).
argon2 = "0.6.0"
ed25519-dalek = { version = "3", default-features = false }
getrandom = "0.4.3"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.11.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
blake3 = "1.8"
# Streaming downloads: a response body fed from a blocking reader.
bytes = "1.12"
# Page variants: pure-Rust decoders (no colour-management or EXR/TIFF extras),
# resizing and JPEG; WebP through libwebp in koma-webp.
fast_image_resize = { version = "6.2", default-features = false, features = ["std"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
http-body = "1.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
koma-webp = { path = "../koma-webp" }
rusqlite = { version = "0.43", features = ["bundled", "collation"] }
# EPUB: container, package, contents and chapters are XML (tokenized only;
# what the reader shows is written by Koma-1 from an allowlist).
quick-xml = { version = "0.42", default-features = false, features = ["escape-html"] }
serde_json = "1"
# 7z (CB7) in pure Rust; LZMA and LZMA2 only (no encryption, no extra codecs).
sevenz-rust2 = { version = "0.27", default-features = false }
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "net", "signal", "macros", "sync"] }

[dev-dependencies]
blake3 = "1.8"
koma-fixtures = { path = "../koma-fixtures" }
tokio = { version = "1.54", features = ["sync"] }

[lints]
workspace = true
