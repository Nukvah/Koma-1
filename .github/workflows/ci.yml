name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97"

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  budgets:
    # ARM64 is the target hardware; x86_64 checks the image builds and runs there too.
    name: image and budgets (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (static musl, FROM scratch)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: koma:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Check budgets in a 2 CPU / 1 GB container
        run: cargo xtask budgets --image koma:ci

  fuzz:
    # Each parser of hostile input runs for a minute on every pull request,
    # seeded with the made-up library. A crash fails the job and uploads the
    # input that caused it.
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Seed corpora from the made-up library
        run: |
          cargo run --quiet -p xtask -- fixtures "$RUNNER_TEMP/library"
          mkdir -p fuzz/corpus/zip_index fuzz/corpus/sevenz
          find "$RUNNER_TEMP/library" -name '*.cbz' -exec cp {} fuzz/corpus/zip_index/ \;
          find "$RUNNER_TEMP/library" -name '*.cb7' -exec cp {} fuzz/corpus/sevenz/ \;
      - name: Build the fuzz targets
        working-directory: fuzz
        # cargo-fuzz defaults to the target it was itself built for (musl,
        # from the prebuilt binary); the sanitizers need the gnu target.
        run: cargo fuzz build --target x86_64-unknown-linux-gnu
      - name: Run each target for 60 s
        working-directory: fuzz
        run: |
          for target in $(cargo fuzz list); do
            echo "::group::$target"
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
            echo "::endgroup::"
          done
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
